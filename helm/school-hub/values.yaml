# ─── Namespace ────────────────────────────────────────────
namespace: school-hub

# ─── Backend ──────────────────────────────────────────────
backend:
  image:
    repository: school-backend
    tag: latest
    pullPolicy: Never   # local kind image; no registry push needed
  replicas: 1
  port: 3000
  env:
    nodeEnv: development
    authMode: local
    dataBackend: postgres
    adminEmail: admin@brightfuture.edu
    sessionTtlMinutes: "60"
    host: "0.0.0.0"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# ─── Frontend ─────────────────────────────────────────────
frontend:
  image:
    repository: school-frontend
    tag: latest
    pullPolicy: Never
  replicas: 1
  port: 80
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

# ─── PostgreSQL ───────────────────────────────────────────
postgres:
  image: postgres:16-alpine
  dbName: schooldb
  user: postgres
  password: password     # override this in production!
  storage: 1Gi
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# ─── Ingress ──────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  host: school.local
